<style>
    body{
        font-family: Arial, sans-serif;
        text-align: center;
        background: #ffffff;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
    }

    .container{
        width: 90%;

        margin-top: 20px;

        z-index: 10;
    }

    img{
        width: 100%;
        border-radius: 10px;

    .box{
        border: 3px solid red;
        padding: 20px;
        margin-top: 20px;
        border-radius: 20px;
        font-size: 22px;
        line-height: 35px;
    }

    .btn{
        display: inline-block;
        background: #007bff;
        color: #fff;
        padding: 15px 25px;
        font-size: 22px;
        border-radius: 10px;
        margin-top: 20px;
        text-decoration: none;
    }

    /* Falling hearts & flowers */
    .fall {
        position: fixed;
        top: -10px;
        animation: fall 6s linear infinite;
        font-size: 25px;
        z-index: 1;
        user-select: none;
        pointer-events: none;
    }

    @keyframes fall {
        0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
        100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }
</style>
</head>

<body>

<!-- Falling emojis generated dynamically -->
<script>
    const emojis = ["❤", "🌸", "💗", "💞"];
    function createFall() {
        const fall = document.createElement("div");
        fall.className = "fall";
        fall.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        fall.style.left = Math.random() * 100 + "vw";
        fall.style.fontSize = (20 + Math.random() * 20) + "px";
        fall.style.animationDuration = (4 + Math.random() * 4) + "s";
        document.body.appendChild(fall);

        setTimeout(() => fall.remove(), 7000);
    }
    setInterval(createFall, 300);
</script>
