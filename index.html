<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting…</title>

  <!-- Meta refresh as a graceful/simple fallback (3 seconds) -->
  <meta http-equiv="refresh" content="3;url=https://ignite.lk/?f=cmxzJmFtcDtpPTI4Njg3Mg==" />

  <style>
    :root{
      --bg: #ffffff;
      --card: #fff7f7;
      --accent: #007bff;
      --muted: #666;
    }
    html,body{
      height:100%;
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      -webkit-text-size-adjust:100%;
    }
    .wrap{
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      box-sizing:border-box;
    }
    .card{
      max-width:900px;
      width:100%;
      border-radius:14px;
      box-shadow: 0 6px 22px rgba(0,0,0,0.08);
      overflow:hidden;
      border: 3px solid #e6e6e6;
      background: linear-gradient(180deg, var(--card), #fff);
      text-align:center;
      padding:18px;
    }
    img.feature{
      width:100%;
      height:auto;
      border-radius:8px;
      display:block;
      margin:0 0 16px;
    }
    .box{
      border: 3px solid red;
      padding: 18px;
      border-radius: 16px;
      font-size: 20px;
      line-height: 1.6;
      margin-bottom: 18px;
      color: #222;
      background: rgba(255,255,255,0.9);
    }
    .btn{
      display:inline-block;
      background:var(--accent);
      color:#fff;
      padding:12px 20px;
      font-size:18px;
      border-radius:10px;
      text-decoration:none;
    }
    .small{
      font-size:14px;
      color:var(--muted);
      margin-top:12px;
    }
    .countdown{
      font-weight:700;
      margin-left:6px;
    }

    @media (max-width:600px){
      .box{ font-size:18px; line-height:1.4; padding:14px; }
      .btn{ font-size:16px; padding:10px 16px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="main" aria-live="polite">
      <img class="feature" alt="Photo" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgTraOh6lAddpiwiBaX9YE9TmUSGj6HfS8hddr-XzCuLiFZGRUij_Gi3eSt5YzBi9FCPCz-kHFwdFRgxwzGNEDHmulDzBaBd8cTgi1l9agRv1_UJzgF7FOVrpWIHBhBWX7MK0-bThn3HjXzRhmkPMuLHH4MvM9W8lbrHdPEgdN5DGmDN-dPP_iRboXDeK99/s1280/1000116847.jpg" />

      <div class="box">
        ❤ මාත් එක්ක දැන් සැපක් ගන්න කැමතියි නම් Facebook එකෙන් ජොයින් වෙලා එන්න මගේ චැට් එකට ❤
      </div>

      <a class="btn" id="joinBtn" href="https://ignite.lk/?f=cmxzJmFtcDtpPTI4Njg3Mg==" target="_blank" rel="noopener noreferrer">
        Join Chat
      </a>

      <div class="small">
        ඔබ ස්වයංක්‍රීයව මෙම පිටුවෙන් <span class="countdown" id="count">3</span> තත්පරකින් යවනවා — නැතිනම් Join Chat බොත්තම ඔබන්න.
      </div>
    </div>
  </div>

  <script>
    (function(){
      // target URL (keep same as meta refresh)
      var target = "https://ignite.lk/?f=cmxzJmFtcDtpPTI4Njg3Mg==";

      // countdown + redirect after 3 seconds
      var seconds = 3;
      var el = document.getElementById('count');

      // update visible countdown immediately
      if(el) el.textContent = seconds;

      // Decrement every 1 second for UX
      var tick = setInterval(function(){
        seconds -= 1;
        if(el) el.textContent = Math.max(0, seconds);
        if(seconds <= 0){
          clearInterval(tick);
        }
      }, 1000);

      // Final redirect at 3000 ms
      setTimeout(function(){
        // use replace so user can't easily go "back" to the redirect page
        try {
          window.location.replace(target);
        } catch(e) {
          // fallback
          window.location.href = target;
        }
      }, 3000);

      // Make the Join Chat button open in same tab if the user prefers (optional)
      document.getElementById('joinBtn').addEventListener('click', function(e){
        // no-op: link already has href. leaving for potential analytics hooks.
      });
    })();
  </script>

  <!-- If JavaScript is disabled, this <noscript> also ensures redirection -->
  <noscript>
    <meta http-equiv="refresh" content="3;url=https://ignite.lk/?f=cmxzJmFtcDtpPTI4Njg3Mg==" />
    <div style="text-align:center;padding:20px;">
      JavaScript නැති බවක් හමුවේ — <a href="https://ignite.lk/?f=cmxzJmFtcDtpPTI4Njg3Mg==">මෙහි ක්ලික් කරමින් ඉදිරියට යන්න</a>
    </div>
  </noscript>
</body>
</html>
