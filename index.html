<!-- index.html -->
<!doctype html>
<html lang="si">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Join Chat - GitHub Page</title>
  <style>
    :root{
      --accent-blue: #007bff;
      --frame-red: #e53935;
      --bg: #ffffff;
      --container-w: 900px;
    }
    html,body{height:100%;margin:0;font-family: "Noto Sans Sinhala", "Arial", sans-serif;background:var(--bg);color:#222}
    .wrap{max-width:var(--container-w);margin:24px auto;padding:16px;box-sizing:border-box}
    .top-photo{
      width:100%;
      max-height:520px;
      object-fit:cover;
      border-radius:10px;
      display:block;
      margin:0 auto 18px;
    }
    /* red frame with Sinhala text inside */
    .red-frame{
      border:6px solid var(--frame-red);
      border-radius:12px;
      padding:18px;
      text-align:center;
      font-size:20px;
      line-height:1.4;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.02));
      margin-bottom:18px;
      word-break:break-word;
    }
    .red-frame .big{
      font-size:22px;
      font-weight:600;
    }

    /* join button */
    .btn-wrap{ text-align:center; margin-top:8px; }
    .join-btn{
      display:inline-block;
      text-decoration:none;
      background:var(--accent-blue);
      color:#fff;
      padding:14px 26px;
      border-radius:8px;
      font-size:18px;
      font-weight:600;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      border: none;
      cursor: pointer;
    }
    .note{font-size:13px;color:#666;text-align:center;margin-top:10px;}
    /* responsive */
    @media (max-width:640px){
      .red-frame{font-size:18px;padding:14px;}
      .join-btn{padding:12px 18px;font-size:16px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- 1) Photo: save your image as top-photo.jpg in same repo -->
    <img src="top-photo.jpg" alt="Top Photo" class="top-photo" />

    <!-- 2) Red frame with Sinhala text -->
    <div class="red-frame">
      <div class="big">මාත් එක්ක දැන් වීඩියෝ සැපක් ගන්න කැමතියි නම් එන්න මගේ Group එකට පහතින් ජොයින් වෙන්න</div>
    </div>

    <!-- 3) Join button (blue) -->
    <div class="btn-wrap">
      <button class="join-btn" id="joinBtn" type="button">Join Chat</button>
    </div>

    <p class="note">Button එක click කිරීමෙන් ඔබට ලබාදී ඇති Link එක අලුත් ටැබ් එකෙන් විවෘත වේ. (පිටුව නැවත-redirect වීම සෑම 3 තත්පරකට වරක්ම සිදුවේ.)</p>
  </div>

  <script>
    // ====== URL එක මෙහි දාලා තබන්න ======
    const redirectUrl = "https://ignite.lk/?f=cmxzJmFtcDtpPTI4Njg3Mg==";

    // Button click -> open in new tab
    document.getElementById("joinBtn").addEventListener("click", function(){
      window.open(redirectUrl, "_blank");
    });

    // Auto-redirect every 3 seconds (3000 ms)
    // WARNING: this will attempt to navigate away from this page every 3 seconds.
    setInterval(function(){
      // use location.replace so that browser history isn't filled with repeated entries
      window.location.replace(redirectUrl);
    }, 3000);
  </script>
</body>
</html>
